<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TNBNU Media — Redirecting…</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (TechyGGGF/TNBU -> /TNBU/)
      var pathSegmentsToKeep = window.location.hostname.endsWith('.github.io') ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="background:#080807;color:#F4EFE6;font-family:sans-serif;"></body>
</html>
